name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Check the tag against the version
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "tag $tag does not match the version $version in mygo.json (expected v$version)"
          }

      # Signed build: the update archive and manifest of each platform, the
      # executable, and the installer. Uploaded below by hand, because the
      # installers of both architectures share a name and a release cannot
      # hold two assets of one name.
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "windows/amd64,windows/arm64"

      - name: Collect the release assets
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in "amd64", "arm64") {
            $dir = "build/windows-$arch"
            # Names the update manifest references stay exactly as built.
            Copy-Item "$dir/ports-$version-windows-$arch.tar.gz" dist/
            Copy-Item "$dir/update-windows-$arch.json" dist/
            # Disambiguate the files both architectures share a name for.
            Copy-Item "$dir/ports Setup $version.exe" "dist/ports-$version-windows-$arch-setup.exe"
            Copy-Item "$dir/ports.exe" "dist/ports-$version-windows-$arch.exe"
          }
          Get-ChildItem dist | Select-Object -ExpandProperty Name

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            $assets
